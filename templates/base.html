<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Inspección de Urbanismo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #16294A;
    color: #16294A;
    margin: 0;
    padding: 0;
  }
  .contenedor {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    min-height: 100vh;
    padding: 20px 18px 40px;
  }
  h1 {
    font-size: 20px;
    color: #16294A;
    margin-top: 6px;
  }
  h2 { font-size: 15px; color: #16294A; margin-top: 22px; margin-bottom: 8px; border-bottom: 2px solid #D4AC0D; padding-bottom: 4px;}
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #5B5346;
    margin-top: 14px;
    margin-bottom: 4px;
  }
  input[type=text], input[type=tel], input[type=number], select, textarea {
    width: 100%;
    padding: 11px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fafafa;
  }
  button, .boton {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #16294A;
    color: #fff;
    margin-top: 20px;
    cursor: pointer;
    text-align: center;
    display: block;
    text-decoration: none;
  }
  button.secundario, .boton.secundario {
    background: #D4AC0D;
    color: #16294A;
  }
  button.peligro, .boton.peligro {
    background: #C0392B;
  }
  .error {
    background: #FCEBEA;
    color: #C0392B;
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 14px;
  }
  .info {
    background: #EAF2FF;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    margin-top: 14px;
  }
  .fila-persona {
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 10px;
    margin-top: 12px;
  }
  .progreso {
    font-size: 13px;
    color: #5B5346;
  }
</style>
</head>
<body>
<div class="contenedor">
{% block contenido %}{% endblock %}
</div>
</body>
</html>
